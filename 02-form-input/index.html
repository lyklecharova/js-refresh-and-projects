<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Dynamic Form Input & Validation</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="card">
            <h2>Interactive Input</h2>
            <form id="userForm" novalidate>
                <!-- Username Group -->
                <div class="input-group">
                    <label for="username">Username:</label>
                    <input
                        type="text"
                        id="username"
                        placeholder="Enter at least 3 characters..."
                        required
                    />
                    <small class="error-msg" id="usernameError"></small>
                </div>
                <!-- Email Group -->
                <div class="input-group">
                    <label for="email">Email:</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter a valid email..."
                        required
                    />
                    <small class="error-msg" id="emailError"></small>
                </div>
                <!-- Password Group with Toggle Button -->
                <div class="input-group">
                    <label for="password">Password:</label>
                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            placeholder="Enter a strong password..."
                            required
                        />
                    </div>

                    <button type="button" id="togglePassword">Show</button>
                    <small class="error-msg" id="passwordError"></small>
                </div>

                <button type="submit" id="submitBtn">Register</button>
            </form>
            <div id="greetingDisplay" class="greeting-display"></div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
