<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Dynamic Form Input & Validation</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <!-- Theme Toggle Button -->
        <button id="themeToggle" class="theme-btn">🌙 Dark Mode</button>
        <div class="card" id="formCard">
            <h2>Interactive Input</h2>

            <form id="userForm" novalidate>
                <!-- Username Group -->
                <div class="input-group">
                    <label for="username">Username:</label>
                    <input
                        type="text"
                        id="username"
                        placeholder="Enter at least 3 characters..."
                        required
                    />
                    <small class="error-msg" id="usernameError"></small>
                </div>
                <!-- Email Group -->
                <div class="input-group">
                    <label for="email">Email:</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter a valid email..."
                        required
                    />
                    <small class="error-msg" id="emailError"></small>
                </div>
                <!-- Password Group with Toggle Button -->
                <div class="input-group">
                    <label for="password">Password:</label>
                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            placeholder="Enter a strong password..."
                            required
                        />
                        <button
                            type="button"
                            id="togglePassword"
                            class="toggle-btn"
                        >
                            Show
                        </button>
                    </div>

                    <div class="strength-bar-container">
                        <div id="strengthBar" class="strength-bar"></div>
                    </div>
                    <small class="error-msg" id="passwordError"></small>
                </div>

                <!-- Confirm Password Group -->
                <div class="input-group">
                    <label for="confirmPassword">Confirm Password:</label>
                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password..."
                            required
                        />
                        <button
                            type="button"
                            id="toggleConfirmPassword"
                            class="toggle-btn"
                        >
                            Show
                        </button>
                    </div>

                    <small class="error-msg" id="confirmPasswordError"></small>
                </div>
                <!-- Terms & Conditions Checkbox -->
                <div class="checkbox-group">
                    <input type="checkbox" id="termsCheckbox" />
                    <label for="termsCheckbox"
                        >I agree to the Terms & Conditions</label
                    >
                </div>
                <button type="submit" id="submitBtn" disabled>Register</button>
            </form>
            <div id="greetingDisplay" class="greeting-display"></div>
        </div>
        <!-- Dashboard / To-Do Section (Hidden initially) -->
        <div class="card hidden" id="dashboardCard">
            <h2 id="welcomeHeader">Welcome!</h2>
            <p class="subtitle">Your Personal Workspace</p>

            <div class="todo-input-group">
                <input
                    type="text"
                    id="todoInput"
                    placeholder="Add a new task..."
                />
                <button id="addTodoBtn">Add</button>
            </div>
            <!-- Task list container with default empty state message -->
            <ul id="todoList" class="todo-list">
                <p class="empty-msg" id="emptyMsg">
                    No tasks added yet. Start by creating one!
                </p>
            </ul>

            <button id="logoutBtn" class="logout-btn">Logout</button>
        </div>
        <script src="script.js"></script>
    </body>
</html>
